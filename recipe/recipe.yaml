schema_version: 1

context:
  # replicate GIT_* variables based on output of `git describe --tags dc42231f0 [+local patches]`, c.f.
  # https://github.com/conda/conda-build/blob/26.5.0/conda_build/environ.py#L253-L265
  # https://docs.conda.io/projects/conda-build/en/stable/user-guide/environment-variables.html#git-environment-variables
  GIT_DESCRIBE_TAG: "v12.0.0"
  GIT_DESCRIBE_NUMBER: "4"
  GIT_DESCRIBE_HASH: "g4f2fc60ca"
  version: ${{ GIT_DESCRIBE_TAG[1:] }}.r${{ GIT_DESCRIBE_NUMBER }}.g${{ GIT_DESCRIBE_HASH }}

recipe:
  name: m2w64-sysroot
  version: ${{ version }}

source:
  git: https://github.com/mingw-w64/mingw-w64
  rev: dc42231f0
  patches:
    - 0001-Allow-to-use-bessel-and-complex-functions-without-un.patch
    - 0002-heades-add-full-name-winrt.patch
    - 0003-use-pthread_compat.h-in-sched.h.patch

build:
  number: 11

outputs:
  - staging:
      name: m2w64-sysroot-stage
    build:
      script:
        file: build
    requirements:
      build:
        - gcc_bootstrap_win-64
        - make

  - package:
      name: mingw-w64-ucrt-x86_64-headers-git
    inherit: m2w64-sysroot-stage
    build:
      noarch: generic
      script:
        file: install.sh
        env:
          # work-around for r-b using noarch
          target_platform: ${{ target_platform }}
      files:
        - x86_64-w64-mingw32/sysroot/usr/include
        - Library/x86_64-w64-mingw32/sysroot/usr/include
    requirements:
      build:
        - gcc_bootstrap_win-64
        - make
      host:
      run:
        - if: unix
          then: __unix
        - if: win
          then: m2-conda-epoch
      run_constraints:
        - mingw-w64-ucrt-x86_64-crt-git ${{ version }}.*
        - mingw-w64-ucrt-x86_64-winpthreads-git ${{ version }}.*
    tests:
      - package_contents:
          files:
            # sample test as stand-in for many
            - if: unix
              then: x86_64-w64-mingw32/sysroot/usr/include/_mingw.h
              else: Library/x86_64-w64-mingw32/sysroot/usr/include/_mingw.h
    about:
      license: ZPL-2.1 AND LGPL-2.1-or-later
      license_file:
        - mingw-w64-headers/ddk/readme.txt
        - COPYING
        - COPYING.MinGW-w64/COPYING.MinGW-w64.txt
      summary: |
        MinGW-w64 headers for Windows (mingw-w64)
      homepage: https://www.mingw-w64.org/

  - package:
      name: mingw-w64-ucrt-x86_64-winpthreads-git
    inherit: m2w64-sysroot-stage
    build:
      noarch: generic
      merge_build_and_host_envs: false
      script:
        file: install.sh
        env:
          target_platform: ${{ target_platform }}
      files:
        - x86_64-w64-mingw32/sysroot/usr/include/semaphore.h
        - x86_64-w64-mingw32/sysroot/usr/include/sched.h
        - x86_64-w64-mingw32/sysroot/usr/include/pthread*.h
        - x86_64-w64-mingw32/sysroot/usr/lib/lib*pthread*.a
        - Library/x86_64-w64-mingw32/sysroot/usr/include/semaphore.h
        - Library/x86_64-w64-mingw32/sysroot/usr/include/sched.h
        - Library/x86_64-w64-mingw32/sysroot/usr/include/pthread*.h
        - Library/x86_64-w64-mingw32/sysroot/usr/lib/lib*pthread*.a
    requirements:
      build:
        - gcc_bootstrap_win-64
        - make
      host:
      run:
        - ${{ pin_subpackage("mingw-w64-ucrt-x86_64-headers-git", exact=True) }}
        - if: unix
          then: __unix
        - if: win
          then: m2-conda-epoch
      run_constraints:
        - mingw-w64-ucrt-x86_64-crt-git ${{ version }}.*
    tests:
      - package_contents:
          files:
            - if: unix
              then:
                - x86_64-w64-mingw32/sysroot/usr/include/pthread.h
                - x86_64-w64-mingw32/sysroot/usr/include/sched.h
              else:
                - Library/x86_64-w64-mingw32/sysroot/usr/include/pthread.h
                - Library/x86_64-w64-mingw32/sysroot/usr/include/sched.h
    about:
      license: MIT AND BSD-3-Clause-Clear
      license_file:
        - mingw-w64-libraries/winpthreads/COPYING
        - COPYING.MinGW-w64/COPYING.MinGW-w64.txt
      summary: |
        MinGW-w64 winpthreads library (mingw-w64)
      homepage: https://www.mingw-w64.org/

  - package:
      name: libwinpthread
    inherit: m2w64-sysroot-stage
    build:
      skip: not win
      merge_build_and_host_envs: false
      script:
        file: install.sh
        env:
          target_platform: ${{ target_platform }}
      files:
        - Library/bin/libwinpthread-1.dll
    requirements:
      build:
        - gcc_bootstrap_win-64
        - make
      host:
        - ucrt
      run:
        - ucrt
      run_constraints:
        - msys2-conda-epoch <0.0a0
        - pthreads-win32 <0.0a0
    tests:
      - package_contents:
          files:
            - Library/bin/libwinpthread-1.dll
    about:
      license: MIT AND BSD-3-Clause-Clear
      license_file:
        - mingw-w64-libraries/winpthreads/COPYING
        - COPYING.MinGW-w64/COPYING.MinGW-w64.txt
      summary: |
        MinGW-w64 winpthreads library (mingw-w64)
      homepage: https://www.mingw-w64.org/

  - package:
      name: winpthreads-devel
    inherit: m2w64-sysroot-stage
    build:
      skip: not win
      merge_build_and_host_envs: false
      script:
        file: install.sh
        env:
          target_platform: ${{ target_platform }}
      files:
        - Library/include/semaphore.h
        - Library/include/sched.h
        - Library/include/pthread*.h
        - Library/lib/lib*pthread*.a
        - Library/lib/pthread.lib
    requirements:
      build:
        - gcc_bootstrap_win-64
        - make
      host:
        - ${{ pin_subpackage("libwinpthread", exact=True) }}
      run:
        - ${{ pin_subpackage("libwinpthread", exact=True) }}
      run_exports:
        - ${{ pin_subpackage("libwinpthread", upper_bound=None) }}
    tests:
      - package_contents:
          include:
            - pthread.h
            - sched.h
            - semaphore.h
          files:
            - Library/lib/libpthread.a
            - Library/lib/libpthread.dll.a
            - Library/lib/libwinpthread.a
            - Library/lib/libwinpthread.dll.a
            - Library/lib/pthread.lib
    about:
      license: MIT AND BSD-3-Clause-Clear
      license_file:
        - mingw-w64-libraries/winpthreads/COPYING
        - COPYING.MinGW-w64/COPYING.MinGW-w64.txt
      summary: |
        MinGW-w64 winpthreads library headers
      homepage: https://www.mingw-w64.org/

  - package:
      name: mingw-w64-ucrt-x86_64-crt-git
    inherit: m2w64-sysroot-stage
    build:
      noarch: generic
      merge_build_and_host_envs: false
      script:
        file: install.sh
        env:
          target_platform: ${{ target_platform }}
      files:
        - x86_64-w64-mingw32/sysroot/usr/include/*.c
        - x86_64-w64-mingw32/sysroot/usr/lib
        - Library/x86_64-w64-mingw32/sysroot/usr/include/*.c
        - Library/x86_64-w64-mingw32/sysroot/usr/lib
    requirements:
      build:
        - gcc_bootstrap_win-64
        - make
      host:
      run:
        - if: unix
          then: __unix
        - if: win
          then: m2-conda-epoch
        - ${{ pin_subpackage("mingw-w64-ucrt-x86_64-headers-git", exact=True) }}
      run_constraints:
        - mingw-w64-ucrt-x86_64-winpthreads-git ${{ version }}.*
    tests:
      - package_contents:
          files:
            # sample test as stand-in for many
            - if: unix
              then: x86_64-w64-mingw32/sysroot/usr/lib/crt1.o
              else: Library/x86_64-w64-mingw32/sysroot/usr/lib/crt1.o
    about:
      license: ZPL-2.1
      license_file: COPYING
      summary: |
        MinGW-w64 CRT for Windows (mingw-w64)
      homepage: https://www.mingw-w64.org/

  - package:
      name: m2w64-sysroot_win-64
    inherit: m2w64-sysroot-stage
    build:
      noarch: generic
      merge_build_and_host_envs: false
      script:
        file: copy.sh
        env:
          target_platform: ${{ target_platform }}
    requirements:
      build:
        - gcc_bootstrap_win-64
        - make
      host:
        - if: win
          then: ucrt
      run:
        - if: unix
          then: __unix
        - if: win
          then: m2-conda-epoch
        - if: win
          then: ucrt
        - mingw-w64-ucrt-x86_64-windows-default-manifest
        - ${{ pin_subpackage("mingw-w64-ucrt-x86_64-crt-git", exact=True) }}
        - ${{ pin_subpackage("mingw-w64-ucrt-x86_64-headers-git", exact=True) }}
        - ${{ pin_subpackage("mingw-w64-ucrt-x86_64-winpthreads-git", exact=True) }}
      run_exports:
        strong:
          - libwinpthread >=${{ version }}
    tests:
      - package_contents:
          files:
            - etc/conda-build/dsolists.d/vcruntime_m2w64_win-64.json
            - if: unix
              then:
                - x86_64-w64-mingw32/sysroot/ucrt64
    about:
      summary: |
        MinGW-w64 sysroot for Windows
      homepage: https://mingw-w64.sourceforge.io/

about:
  summary: A complete runtime environment for GCC & LLVM for 32 and 64 bit windows
  license: ZPL-2.1 AND LGPL-2.1-or-later and MIT AND BSD-3-Clause-Clear
  license_file:
    - COPYING
    - COPYING.MinGW-w64/COPYING.MinGW-w64.txt
  homepage: https://github.com/mingw-w64/mingw-64

extra:
  recipe-maintainers:
    - isuruf
